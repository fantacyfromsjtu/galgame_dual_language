[project]
name = "dual-subtitle-tool"
version = "0.1.0"
description = "Utility scripts for building bilingual subtitle patches for Kirikiri/M2 visual novels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "dual-subtitle-tool contributors" }
]
keywords = ["visual-novel", "kirikiri", "xp3", "freemote", "subtitle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities"
]

[tool.ruff]
line-length = 100
target-version = "py39"
